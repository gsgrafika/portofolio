<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Template Sekolah</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .template-card {
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            padding: 1.5rem;
            transition: box-shadow 0.3s;
        }
        .template-card:hover {
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .template-card .tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin: 0.75rem 0;
        }
        .template-card .tag {
            background: #eff6ff;
            color: #1e40af;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
        }
        .template-card .status {
            font-size: 0.85rem;
            font-weight: bold;
        }
        .status.available { color: #16a34a; }
        .status.coming-soon { color: #ea580c; }
        .template-card .harga {
            font-size: 1.25rem;
            font-weight: bold;
            color: #1e40af;
            margin: 0.5rem 0;
        }
        .btn-demo {
            display: inline-block;
            background: #1e40af;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .btn-demo.disabled {
            background: #cbd5e1;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Koleksi Template Sekolah</h1>
        <p><a href="../index.html">← Kembali ke Portofolio</a></p>
    </header>

    <main>
        <section>
            <h2>Template Tersedia</h2>
            <div id="template-list" class="template-grid">
                <p>Memuat template...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Guntur. Semua hak dilindungi.</p>
    </footer>

    <script>
        async function loadTemplates() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                const container = document.getElementById('template-list');
                container.innerHTML = '';

                data.templates.forEach(tpl => {
                    const isAvailable = tpl.status === 'available';
                    const card = document.createElement('div');
                    card.className = 'template-card';
                    card.innerHTML = `
                        <h3>${tpl.nama}</h3>
                        <div class="tags">
                            ${tpl.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                        </div>
                        <p>${tpl.deskripsi}</p>
                        <p class="harga">${tpl.harga}</p>
                        <p class="status ${tpl.status}">
                            ${isAvailable ? '✅ Tersedia' : '⏳ Segera Hadir'}
                        </p>
                        <p style="margin-top: 1rem;">
                            <a href="${tpl.id}/index.html" 
                               class="btn-demo ${isAvailable ? '' : 'disabled'}">
                                ${isAvailable ? 'Lihat Demo →' : 'Belum Tersedia'}
                            </a>
                        </p>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                document.getElementById('template-list').innerHTML = 
                    '<p>Gagal memuat daftar template.</p>';
                console.error(error);
            }
        }

        loadTemplates();
    </script>
</body>
</html>
